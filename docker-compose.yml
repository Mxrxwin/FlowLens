services:
  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./backend
    env_file: ./.env
    depends_on:
      - redis
      - postgres
    restart: on-failure
    expose:
      - "${FLOWLENS_BACKEND_PORT:-8081}"
    volumes:
      # Read-only mount of the GeoLite2-City DB. Empty volume is fine —
      # backend will log a warning and fall back to CDN headers / SDK hint.
      - geoip:/geoip:ro

  frontend:
    build: ./frontend
    env_file: ./.env
    environment:
      FLOWLENS_DASHBOARD_PASSWORD: ${FLOWLENS_DASHBOARD_PASSWORD:-}
      FLOWLENS_DASHBOARD_USER: ${FLOWLENS_DASHBOARD_USER:-admin}
    depends_on:
      - backend
    ports:
      - "${FLOWLENS_HTTP_PORT:-5173}:80"

  # Optional: refresh GeoLite2-City on a weekly schedule. Activated only when
  # both MAXMIND_ACCOUNT_ID and MAXMIND_LICENSE_KEY are set in .env (the
  # 'geoip' profile keeps it out of `docker compose up` by default).
  geoip-updater:
    image: maxmindinc/geoipupdate:v7.0
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      # Run once per week; image loops internally on this interval.
      GEOIPUPDATE_FREQUENCY: "168"
    volumes:
      - geoip:/usr/share/GeoIP
    restart: unless-stopped

volumes:
  pgdata:
  geoip:
