server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so upstream hostnames are resolved at request
    # time, not at startup. Without this nginx refuses to start when the
    # backend container is not yet reachable during DNS lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /ingest is intentionally open — browser SDKs post events without credentials.
    location = /ingest {
        set $backend http://backend:8081;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/auth_basic.conf;
        set $backend http://backend:8081;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-FlowLens-Region $http_x_flowlens_region;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Vercel-IP-City $http_x_vercel_ip_city;
        proxy_set_header X-Vercel-IP-Country-Region $http_x_vercel_ip_country_region;
        proxy_set_header X-Vercel-IP-Country $http_x_vercel_ip_country;
    }

    location / {
        include /etc/nginx/auth_basic.conf;
        try_files $uri $uri/ /index.html;
    }
}
