server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-FlowLens-Region $http_x_flowlens_region;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Vercel-IP-City $http_x_vercel_ip_city;
        proxy_set_header X-Vercel-IP-Country-Region $http_x_vercel_ip_country_region;
        proxy_set_header X-Vercel-IP-Country $http_x_vercel_ip_country;
    }

    location = /ingest {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
